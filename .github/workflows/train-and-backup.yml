name: Train and preserve model checkpoints

on:
  workflow_dispatch:
    inputs:
      confirm_training:
        description: "Training consumes GitHub Actions time. Select YES only when ready."
        required: true
        type: choice
        options:
          - "NO"
          - "YES"
        default: "NO"

permissions:
  contents: write

concurrency:
  group: model-training-${{ github.ref }}
  cancel-in-progress: false

jobs:
  train:
    if: ${{ inputs.confirm_training == 'YES' }}
    name: CPU training and checkpoint backup
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4
      - name: Restore the original pilot baseline if no checkpoint exists
        run: |
          set -euo pipefail
          checkpoint="data/checkpoints/best_model.pt"
          if [[ -s "$checkpoint" ]]; then
            echo "An existing best-model checkpoint is present; preserving it without replacement."
            exit 0
          fi
          mkdir -p data/checkpoints
          temporary_file="$(mktemp)"
          trap 'rm -f "$temporary_file"' EXIT
          checkpoint_url="https://github.com/Nomusa990822/AlphaZero-Style-Chess-AI-Self-Play-Reinforcement-Learning-with-MCTS-and-Policy-Value-Networks/releases/download/fresh-pilot-checkpoint-43497298757-1/best_model.pt"
          expected_sha256="7a9fdacbd14f6423e34b2edb470d255e15081a12b1e66faf204a5e07e24e4471"
          curl --fail --location --retry 3 --retry-delay 2 "$checkpoint_url" --output "$temporary_file"
          echo "$expected_sha256  $temporary_file" | sha256sum --check --status
          install -m 600 "$temporary_file" "$checkpoint"
          echo "Restored and SHA-256-verified the immutable epoch-0 pilot baseline."
      - name: Require an existing best-model checkpoint before spending runner time
        run: |
          if [[ ! -s data/checkpoints/best_model.pt ]]; then
            echo "::error::No non-empty data/checkpoints/best_model.pt was found."
            echo "This workflow is configured to resume an existing model, not start from random weights."
            echo "Restore a compatible checkpoint before dispatching training."
            exit 1
          fi
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2.0"
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Run configured training pipeline
        run: python train_pipeline.py
      - name: Build checkpoint SHA-256 manifest
        if: always()
        run: python scripts/create_checkpoint_manifest.py
      - name: Preserve checkpoints as a workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chess-model-checkpoints-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/checkpoints/*.pt
            reports/checkpoint-manifest.json
          if-no-files-found: warn
          retention-days: 90
      - name: Publish durable checkpoint release
        if: ${{ success() && hashFiles('data/checkpoints/*.pt') != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: model-checkpoint-${{ github.run_id }}-${{ github.run_attempt }}
          name: Model checkpoint backup ${{ github.run_id }}
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            data/checkpoints/*.pt
            reports/checkpoint-manifest.json
          body: |
            Automated model checkpoint backup from workflow run ${{ github.run_id }}.
            Source revision: ${{ github.sha }}
            SHA-256 hashes are recorded in checkpoint-manifest.json.
            This is a model artifact release, not a source-code release.
