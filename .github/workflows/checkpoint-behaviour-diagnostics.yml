name: Checkpoint behaviour diagnostics

on:
  workflow_dispatch:
    inputs:
      confirm_diagnostics:
        description: "Run CPU diagnostics on the saved baseline and candidate checkpoints?"
        required: true
        type: choice
        options:
          - "NO"
          - "YES"
        default: "NO"
      mcts_simulations:
        description: "MCTS simulations per position"
        required: true
        type: choice
        options:
          - "10"
          - "25"
          - "50"
        default: "25"

permissions:
  contents: read

jobs:
  diagnose:
    if: github.ref == 'refs/heads/main' && inputs.confirm_diagnostics == 'YES'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out diagnostic runner
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2.0"

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Download the two pilot checkpoints
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p data/checkpoints
          gh release download fresh-pilot-checkpoint-43497298757-1 \
            --repo "${GITHUB_REPOSITORY}" --pattern best_model.pt \
            --dir data/checkpoints
          gh release download fresh-pilot-checkpoint-43497298757-1 \
            --repo "${GITHUB_REPOSITORY}" --pattern latest_candidate.pt \
            --dir data/checkpoints
          echo "Downloaded checkpoint sizes and hashes:"
          wc -c data/checkpoints/best_model.pt data/checkpoints/latest_candidate.pt
          sha256sum data/checkpoints/best_model.pt data/checkpoints/latest_candidate.pt
          echo "7a9fdacbd14f6423e34b2edb470d255e15081a12b1e66faf204a5e07e24e4471  data/checkpoints/best_model.pt" | sha256sum --check -
          echo "3b471702e89659307f11ec95b3f83316ccae7c29a4c7d9d6faa7afaa4f7231a7  data/checkpoints/latest_candidate.pt" | sha256sum --check -

      - name: Run checkpoint behaviour diagnostics
        run: |
          python checkpoint_diagnostics.py \
            --baseline data/checkpoints/best_model.pt \
            --candidate data/checkpoints/latest_candidate.pt \
            --simulations "${{ inputs.mcts_simulations }}" \
            --top-k 5 \
            --output reports/checkpoint-behaviour-diagnostics.json

      - name: Upload diagnostic report
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint-behaviour-diagnostics
          path: reports/checkpoint-behaviour-diagnostics.json
          if-no-files-found: error
          retention-days: 90
