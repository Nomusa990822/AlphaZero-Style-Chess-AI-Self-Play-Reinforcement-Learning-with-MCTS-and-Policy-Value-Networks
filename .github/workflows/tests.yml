name: Tests

on:
  push:
    branches:
      - main
      - chess-strength-training-upgrade
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Python 3.11 · CPU tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2.0"

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Run test suite
        run: python -m pytest -q

      - name: Measure SEE root-expansion overhead
        run: python -m scripts.benchmark_see_overhead --repeats 25 --warmups 3 --batch-size 10

      - name: Upload SEE overhead benchmark
        uses: actions/upload-artifact@v4
        with:
          name: see-root-overhead-benchmark
          path: reports/see-root-overhead-benchmark.json
          if-no-files-found: error
          retention-days: 30
