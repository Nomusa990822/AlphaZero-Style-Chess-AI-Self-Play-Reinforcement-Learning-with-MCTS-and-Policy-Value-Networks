name: Fresh-start CPU training pilot

on:
  workflow_dispatch:
    inputs:
      confirm_fresh_training:
        description: "This creates new random weights and consumes GitHub Actions time. Select YES only when ready."
        required: true
        type: choice
        options:
          - "NO"
          - "YES"
        default: "NO"

permissions:
  contents: write

concurrency:
  group: fresh-chess-pilot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pilot:
    if: ${{ github.ref == 'refs/heads/chess-strength-training-upgrade' && inputs.confirm_fresh_training == 'YES' }}
    name: Bounded fresh-start CPU pilot
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2.0"
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Run bounded fresh-start pilot
        run: python fresh_start_pilot.py
      - name: Build pilot checkpoint manifest
        if: always()
        run: |
          python scripts/create_checkpoint_manifest.py \
            --checkpoint-dir data/checkpoints/fresh_pilot \
            --output reports/fresh-pilot-checkpoint-manifest.json
      - name: Preserve all pilot outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fresh-chess-pilot-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/checkpoints/fresh_pilot/
            data/replay_buffer/fresh_pilot/
            data/logs/fresh_pilot/
            reports/fresh-pilot-checkpoint-manifest.json
          if-no-files-found: warn
          retention-days: 90
      - name: Publish durable checkpoint backup
        if: ${{ success() && hashFiles('data/checkpoints/fresh_pilot/*.pt') != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fresh-pilot-checkpoint-${{ github.run_id }}-${{ github.run_attempt }}
          name: Fresh-start chess pilot checkpoint ${{ github.run_id }}
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            data/checkpoints/fresh_pilot/*.pt
            reports/fresh-pilot-checkpoint-manifest.json
          body: |
            Bounded fresh-start CPU pilot checkpoint backup.
            Source revision: ${{ github.sha }}
            This is an initial pilot artifact, not a playing-strength claim.
