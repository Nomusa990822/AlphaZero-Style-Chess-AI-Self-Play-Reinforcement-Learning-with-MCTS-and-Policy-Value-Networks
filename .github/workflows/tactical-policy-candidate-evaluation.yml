name: Tactical policy candidate evaluation

on:
  workflow_dispatch:
    inputs:
      confirm_evaluation:
        description: "Compare the tactical-policy candidate against the immutable baseline (CPU only; no training or promotion)."
        required: true
        type: choice
        options:
          - "NO"
          - "YES"
        default: "NO"
      candidate_run_id:
        description: "GitHub Actions run ID that produced the tactical-policy candidate artifact."
        required: true
        type: string
        default: "43517201570"
      mcts_simulations:
        description: "MCTS simulations per move for tactical and sequence evaluations."
        required: true
        type: choice
        options:
          - "10"
          - "25"
          - "50"
        default: "25"

permissions:
  actions: read
  contents: read

concurrency:
  group: tactical-policy-candidate-evaluation
  cancel-in-progress: false

jobs:
  evaluate:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm_evaluation == 'YES' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out evaluation code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install CPU PyTorch and project dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2.0"
          python -m pip install -r requirements.txt

      - name: Download and verify immutable baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p data/checkpoints/evaluation
          gh release download fresh-pilot-checkpoint-43497298757-1 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "best_model.pt" \
            --dir data/checkpoints/evaluation
          echo "7a9fdacbd14f6423e34b2edb470d255e15081a12b1e66faf204a5e07e24e4471  data/checkpoints/evaluation/best_model.pt" | sha256sum --check -

      - name: Download and verify candidate training artifact
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          set -euo pipefail
          if ! [[ "$CANDIDATE_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "candidate_run_id must contain digits only." >&2
            exit 1
          fi
          mkdir -p candidate-artifact
          gh run download "$CANDIDATE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "tactical-policy-learning-pilot-$CANDIDATE_RUN_ID" \
            --dir candidate-artifact
          REPORT="candidate-artifact/reports/tactical-policy-learning-report.json"
          CANDIDATE="candidate-artifact/data/checkpoints/tactical_policy_candidate.pt"
          test -s "$REPORT"
          test -s "$CANDIDATE"
          EXPECTED_SOURCE="$(jq -r '.source_checkpoint.sha256' "$REPORT")"
          EXPECTED_CANDIDATE="$(jq -r '.candidate_checkpoint.sha256' "$REPORT")"
          ACTUAL_CANDIDATE="$(sha256sum "$CANDIDATE" | cut -d' ' -f1)"
          test "$EXPECTED_SOURCE" = "7a9fdacbd14f6423e34b2edb470d255e15081a12b1e66faf204a5e07e24e4471"
          test "$EXPECTED_CANDIDATE" = "$ACTUAL_CANDIDATE"
          cp "$CANDIDATE" data/checkpoints/evaluation/tactical_policy_candidate.pt
          echo "Verified candidate SHA-256: $ACTUAL_CANDIDATE"
          echo "Candidate training report:"
          cat "$REPORT"

      - name: Run policy, value and MCTS diagnostics
        run: |
          set -euo pipefail
          python checkpoint_diagnostics.py \
            --baseline data/checkpoints/evaluation/best_model.pt \
            --candidate data/checkpoints/evaluation/tactical_policy_candidate.pt \
            --simulations "${{ inputs.mcts_simulations }}" \
            --top-k 5 \
            --output reports/tactical-policy-checkpoint-diagnostics.json

      - name: Run tactical-position benchmark on both checkpoints
        run: |
          set -euo pipefail
          for MODEL in baseline candidate; do
            if [ "$MODEL" = baseline ]; then
              CHECKPOINT=data/checkpoints/evaluation/best_model.pt
            else
              CHECKPOINT=data/checkpoints/evaluation/tactical_policy_candidate.pt
            fi
            python evaluate_tactics.py \
              --checkpoint "$CHECKPOINT" \
              --simulations "${{ inputs.mcts_simulations }}" \
              --device cpu \
              --output "reports/tactical-positions-$MODEL.json"
          done

      - name: Run combined tactical-sequence benchmark on both checkpoints
        run: |
          set -euo pipefail
          for MODEL in baseline candidate; do
            if [ "$MODEL" = baseline ]; then
              CHECKPOINT=data/checkpoints/evaluation/best_model.pt
            else
              CHECKPOINT=data/checkpoints/evaluation/tactical_policy_candidate.pt
            fi
            python evaluate_tactical_sequences.py \
              --checkpoint "$CHECKPOINT" \
              --simulations "${{ inputs.mcts_simulations }}" \
              --device cpu \
              --output "reports/tactical-sequences-$MODEL.json"
          done

      - name: Upload complete comparison reports
        uses: actions/upload-artifact@v4
        with:
          name: tactical-policy-candidate-evaluation-${{ github.run_id }}
          path: |
            reports/tactical-policy-checkpoint-diagnostics.json
            reports/tactical-positions-baseline.json
            reports/tactical-positions-candidate.json
            reports/tactical-sequences-baseline.json
            reports/tactical-sequences-candidate.json
            candidate-artifact/reports/tactical-policy-learning-report.json
          if-no-files-found: error
          retention-days: 90
